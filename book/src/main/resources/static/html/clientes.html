<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <link rel="stylesheet" href="../css/geral.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body onload="listarTodosClientes()">
    <header>
        <h1>BiblioTech</h1>
    </header>
    <nav>
        <a href="index.html">Empréstimos</a>
        <a href="clientes.html">Clientes</a>
        <a href="livros.html">Livros</a>
    </nav>
    <main>        
        <!-- <button onclick="listarTodosClientes()">Listar Todos</button> -->
        <div class="card-container">
            <div class="card">
                <h3>Cadastro</h3>
                <input type="text" placeholder="nome" id="nomeInserirCliente">
                <input type="text" placeholder="endereco" id="enderecoInserirCliente">
                <input type="text" placeholder="cpf" id="cpfInserirCliente">
                <input type="text" placeholder="telefone" id="telefoneInserirCliente">
                <button onclick="inserirCliente()">Inserir Cliente</button>
            </div>
            
            <div class="card">
                <h3>Alterar</h3>
                <input type="number" placeholder="id" id="idEditarCliente">
                <input type="text" placeholder="nome" id="nomeEditarCliente">
                <input type="text" placeholder="endereco" id="enderecoEditarCliente">
                <input type="text" placeholder="cpf" id="cpfEditarCliente">
                <input type="text" placeholder="telefone" id="telefoneEditarCliente">
                <button onclick="editarCliente()">Editar Cliente</button>
            </div>
            <div class="card">
                <h3>Deletar</h3>
                <input type="number" min="1" placeholder="Deletar" id="idDeletarCliente">
                <button onclick="deletarCliente()">Deletar por id</button>
            </div>
        </div>

        <h3 class="tituloCadastrados">Clientes Cadastrados</h3>

        <div class="filtroBusca">
            <input type="number" min="1" placeholder="ID" id="idBuscarCliente" class="idBuscar">
            <button onclick="buscarClienteId()" class="buttonBuscar">Buscar Por ID</button>
            <input type="text" placeholder="Nome" id="nomeBuscarCliente" class="nomeBuscar">
            <button onclick="buscarClienteNome()" class="buttonBuscar">Buscar Por Nome</button>
        </div>
        
        <div id="tabelaClientes"></div>
    </main>
    <footer>
         <p>Projeto desenvolvido por <a href="https://github.com/MatheusSouzaRamos/bookManager"><strong>Matheus</strong></a></p>
    </footer>
    <script src="../js/clientes.js"></script>
</body>
</html>
